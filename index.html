<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markov Family Tree</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-title h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-title p {
            margin: 2px 0 0 0;
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stats-bar {
            display: flex;
            gap: 8px;
        }
        .stat-badge {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.78rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        .controls-bar {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            user-select: none;
        }
        .btn:hover {
            background: #334155;
            border-color: #475569;
            color: #38bdf8;
        }
        .btn-primary {
            background: #2563eb;
            border-color: #3b82f6;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #60a5fa;
            color: #ffffff;
        }

        .tree-viewport {
            flex: 1;
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .tree-viewport:active {
            cursor: grabbing;
        }

        #tree-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Node Styling */
        .node {
            cursor: pointer;
        }
        .node circle { 
            fill: #3b82f6; 
            stroke: #60a5fa; 
            stroke-width: 2.5px; 
            transition: all 0.2s ease;
        }
        .node.has-children circle {
            fill: #2563eb;
            stroke: #93c5fd;
        }
        .node.collapsed circle {
            fill: #f59e0b;
            stroke: #fde047;
            r: 8px;
        }
        .node:hover circle {
            fill: #a855f7;
            stroke: #c084fc;
            r: 9.5px;
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.7));
        }

        .node text.name-text { 
            font-family: 'Inter', sans-serif;
            font-size: 11px; 
            font-weight: 500;
            fill: #f1f5f9;
            text-anchor: middle;
            pointer-events: none;
        }

        .node text.location-text { 
            font-family: 'Inter', sans-serif;
            font-size: 9.5px; 
            font-weight: 400;
            fill: #38bdf8;
            text-anchor: middle;
            pointer-events: none;
        }

        /* Link Line Styling */
        .link { 
            fill: none; 
            stroke: #475569; 
            stroke-width: 2px; 
            stroke-linecap: round;
            transition: stroke 0.25s ease, stroke-width 0.25s ease;
        }
        .link.highlighted {
            stroke: #a855f7;
            stroke-width: 3px;
        }

        .hint-toast {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #94a3b8;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <h1>Markov Family Tree</h1>
            <p>Interactive Top-to-Bottom Genealogical Diagram</p>
        </div>

        <div class="header-right">
            <div class="stats-bar">
                <span class="stat-badge" id="stat-members">Loading...</span>
                <span class="stat-badge" id="stat-generations">Loading...</span>
            </div>

            <div class="controls-bar">
                <button class="btn btn-primary" onclick="fitToScreen()" title="Fit entire tree to screen">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    Fit Screen
                </button>
                <button class="btn" onclick="zoomIn()" title="Zoom In">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    Zoom +
                </button>
                <button class="btn" onclick="zoomOut()" title="Zoom Out">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    Zoom -
                </button>
                <button class="btn" onclick="expandAll()" title="Expand All Branches">
                    Expand All
                </button>
                <button class="btn" onclick="collapseAll()" title="Collapse Branches">
                    Collapse
                </button>
            </div>
        </div>
    </div>
    
    <div class="tree-viewport">
        <svg id="tree-container"></svg>
        <div class="hint-toast">💡 Drag to Pan | Scroll wheel to Zoom | Click nodes to Expand/Collapse</div>
    </div>

    <script>
        let svg, g, zoom, root, treeLayout;
        let width = 3200;
        let height = 1200;
        const margin = {top: 50, right: 60, bottom: 80, left: 60};

        d3.json("gentree-gridnev.json").then(function(treeData) {
            root = d3.hierarchy(treeData);
            
            // Calculate stats
            const descendants = root.descendants();
            document.getElementById("stat-members").textContent = `${descendants.length} Members`;
            document.getElementById("stat-generations").textContent = `${root.height + 1} Generations`;

            // Measure leaf count for dynamic width
            const leafCount = root.leaves().length;
            width = Math.max(2600, leafCount * 115);
            height = Math.max(1000, (root.height + 1) * 200);

            svg = d3.select("#tree-container");
            svg.selectAll("*").remove();

            // Background rect for pan/zoom gestures across whole canvas
            svg.append("rect")
                .attr("width", "100%")
                .attr("height", "100%")
                .attr("fill", "transparent");

            g = svg.append("g").attr("class", "tree-group");

            // D3 Zoom
            zoom = d3.zoom()
                .scaleExtent([0.05, 4])
                .on("zoom", (event) => {
                    g.attr("transform", event.transform);
                });

            svg.call(zoom).on("dblclick.zoom", null);

            treeLayout = d3.tree()
                .size([width - margin.left - margin.right, height - margin.top - margin.bottom])
                .separation((a, b) => (a.parent === b.parent ? 1 : 1.25));

            // Initial render
            update(root);

            // Auto-fit to screen after initial render
            setTimeout(fitToScreen, 150);

            // Handle window resize
            window.addEventListener("resize", fitToScreen);

        }).catch(function(error) {
            console.error("Error loading JSON:", error);
        });

        function update(source) {
            treeLayout(root);

            const nodes = root.descendants();
            const links = root.links();

            // Links
            const link = g.selectAll(".link")
                .data(links, d => d.target.data.name + (d.target.data.attributes?.Location || ""));

            const linkEnter = link.enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical()
                    .x(d => d.x + margin.left)
                    .y(d => d.y + margin.top));

            link.merge(linkEnter)
                .transition().duration(400)
                .attr("d", d3.linkVertical()
                    .x(d => d.x + margin.left)
                    .y(d => d.y + margin.top));

            link.exit().remove();

            // Nodes
            const node = g.selectAll(".node")
                .data(nodes, d => d.data.name + (d.data.attributes?.Location || ""));

            const nodeEnter = node.enter().append("g")
                .attr("class", d => `node ${d.children || d._children ? 'has-children' : ''} ${d._children ? 'collapsed' : ''}`)
                .attr("transform", d => `translate(${d.x + margin.left},${d.y + margin.top})`)
                .on("click", (event, d) => {
                    if (d.children) {
                        d._children = d.children;
                        d.children = null;
                    } else if (d._children) {
                        d.children = d._children;
                        d._children = null;
                    }
                    update(d);
                });

            nodeEnter.append("circle").attr("r", 6.5);

            // Render name text with line wrapping for '&'
            nodeEnter.each(function(d) {
                const el = d3.select(this);
                const name = d.data.name || "";
                const parts = name.includes("&") 
                    ? name.split("&").map((p, i) => i === 1 ? "& " + p.trim() : p.trim())
                    : [name];

                const textEl = el.append("text")
                    .attr("class", "name-text")
                    .attr("y", 18);

                parts.forEach((part, index) => {
                    textEl.append("tspan")
                        .attr("x", 0)
                        .attr("dy", index === 0 ? "0" : "1.2em")
                        .text(part);
                });

                if (d.data.attributes && d.data.attributes.Location) {
                    const locY = 18 + (parts.length * 13);
                    el.append("text")
                        .attr("class", "location-text")
                        .attr("x", 0)
                        .attr("y", locY)
                        .text(`📍 ${d.data.attributes.Location}`);
                }
            });

            const nodeUpdate = node.merge(nodeEnter);

            nodeUpdate.attr("class", d => `node ${d.children || d._children ? 'has-children' : ''} ${d._children ? 'collapsed' : ''}`)
                .transition().duration(400)
                .attr("transform", d => `translate(${d.x + margin.left},${d.y + margin.top})`);

            node.exit().remove();

            // Hover effect for path highlighting
            g.selectAll(".node")
                .on("mouseenter", function(event, d) {
                    const ancestorSet = new Set(d.ancestors());
                    g.selectAll(".link").classed("highlighted", l => ancestorSet.has(l.target) && ancestorSet.has(l.source));
                })
                .on("mouseleave", function() {
                    g.selectAll(".link").classed("highlighted", false);
                });
        }

        function fitToScreen() {
            if (!g || !svg) return;
            const bounds = g.node().getBBox();
            const parent = svg.node().parentElement;
            const fullWidth = parent.clientWidth;
            const fullHeight = parent.clientHeight;
            
            if (bounds.width === 0 || bounds.height === 0) return;
            
            const padding = 30;
            const widthScale = (fullWidth - padding * 2) / bounds.width;
            const heightScale = (fullHeight - padding * 2) / bounds.height;
            const scale = Math.min(widthScale, heightScale, 1.2);
            
            const midX = bounds.x + bounds.width / 2;
            const midY = bounds.y + bounds.height / 2;
            
            const translateX = fullWidth / 2 - scale * midX;
            const translateY = fullHeight / 2 - scale * midY;

            svg.transition().duration(600).call(
                zoom.transform,
                d3.zoomIdentity.translate(translateX, translateY).scale(scale)
            );
        }

        function zoomIn() {
            svg.transition().duration(300).call(zoom.scaleBy, 1.3);
        }

        function zoomOut() {
            svg.transition().duration(300).call(zoom.scaleBy, 0.7);
        }

        function expandAll() {
            function expand(d) {
                if (d._children) {
                    d.children = d._children;
                    d._children = null;
                }
                if (d.children) d.children.forEach(expand);
            }
            expand(root);
            update(root);
            setTimeout(fitToScreen, 450);
        }

        function collapseAll() {
            if (root.children) {
                root.children.forEach(d => {
                    function collapse(n) {
                        if (n.children) {
                            n._children = n.children;
                            n._children.forEach(collapse);
                            n.children = null;
                        }
                    }
                    collapse(d);
                });
            }
            update(root);
            setTimeout(fitToScreen, 450);
        }
    </script>
</body>
</html>
