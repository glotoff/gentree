<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markov Family Tree</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 16px;
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
            flex-shrink: 0;
        }
        .header-title h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-title p {
            margin: 2px 0 0 0;
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stats-bar { display: flex; gap: 8px; }
        .stat-badge {
            background: rgba(30,41,59,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.78rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        .controls-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            user-select: none;
        }
        .btn:hover { background: #334155; border-color: #475569; color: #38bdf8; }
        .btn-primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; border-color: #60a5fa; color: #fff; }

        /* Legend */
        .legend {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2.5px solid;
            flex-shrink: 0;
        }
        .legend-dot.couple {
            background: #1e3a5f;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px #0f172a, 0 0 0 5px #3b82f6;
        }
        .legend-dot.single {
            background: #0e4429;
            border-color: #22c55e;
        }
        .legend-dot.collapsed {
            background: #78350f;
            border-color: #f59e0b;
        }

        .tree-viewport {
            flex: 1;
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .tree-viewport:active { cursor: grabbing; }

        #tree-container { width: 100%; height: 100%; display: block; }

        /* === Node card background === */
        .node-card {
            fill: rgba(15, 23, 42, 0.82);
            stroke: none;
            rx: 6px;
            ry: 6px;
        }
        .node-card.couple-card {
            fill: rgba(30, 58, 95, 0.82);
        }

        /* === Couple node: double-ring indicator === */
        .node-icon-outer {
            fill: none;
            stroke-width: 2px;
            stroke: #3b82f6;
        }
        .node-icon-inner {
            fill: #3b82f6;
            stroke: #93c5fd;
            stroke-width: 1.5px;
        }

        /* Single person node */
        .node-icon-single {
            fill: #22c55e;
            stroke: #4ade80;
            stroke-width: 2px;
        }

        /* Collapsed indicator */
        .node.collapsed .node-icon-outer,
        .node.collapsed .node-icon-inner,
        .node.collapsed .node-icon-single {
            fill: #f59e0b;
            stroke: #fde047;
        }

        /* Hover pulse on node group */
        .node { cursor: pointer; }
        .node:hover .node-icon-outer { stroke: #c084fc; filter: drop-shadow(0 0 6px rgba(168,85,247,0.8)); }
        .node:hover .node-icon-inner { fill: #a855f7; stroke: #c084fc; }
        .node:hover .node-icon-single { fill: #a855f7; stroke: #c084fc; }

        .node text.name-text {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 500;
            fill: #f1f5f9;
            text-anchor: middle;
            pointer-events: none;
        }
        .node text.name-text.couple-name { fill: #93c5fd; }

        .node text.meta-text {
            font-family: 'Inter', sans-serif;
            font-size: 9.5px;
            font-weight: 400;
            text-anchor: middle;
            pointer-events: none;
        }

        /* Links */
        .link {
            fill: none;
            stroke: #334155;
            stroke-width: 1.5px;
            stroke-linecap: round;
            transition: stroke 0.2s ease, stroke-width 0.2s ease;
        }
        .link.highlighted { stroke: #a855f7; stroke-width: 2.5px; }

        .hint-toast {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #94a3b8;
            pointer-events: none;
        }

        /* ─── Search Component Styles ────────────────────────────────────────────── */
        .search-container {
            position: relative;
            min-width: 220px;
            max-width: 320px;
            flex: 1;
        }
        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-icon {
            position: absolute;
            left: 10px;
            color: #64748b;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 6px 28px 6px 30px;
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
            background: #1e293b;
        }
        .search-clear-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 4px;
        }
        .search-clear-btn:hover {
            color: #f1f5f9;
            background: rgba(255,255,255,0.1);
        }
        .search-results-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            border-radius: 8px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            padding: 4px;
        }
        .search-result-item {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .search-result-item:last-child {
            border-bottom: none;
        }
        .search-result-item:hover {
            background: rgba(59, 130, 246, 0.2);
        }
        .search-result-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 2px;
        }
        .search-result-meta {
            font-size: 0.73rem;
            color: #94a3b8;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .search-result-meta span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .search-no-results {
            padding: 12px;
            text-align: center;
            color: #64748b;
            font-size: 0.8rem;
        }
        .search-summary-header {
            padding: 4px 8px 6px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            border-bottom: 1px solid #334155;
            margin-bottom: 4px;
        }

        /* ─── Search Canvas Highlighting & Pulse Animations ────────────────────── */
        @keyframes nodeTargetPulse {
            0% { stroke: #a855f7; stroke-width: 3.5px; filter: drop-shadow(0 0 10px rgba(168,85,247,0.9)); }
            50% { stroke: #ec4899; stroke-width: 5.5px; filter: drop-shadow(0 0 18px rgba(236,72,153,1)); }
            100% { stroke: #a855f7; stroke-width: 3.5px; filter: drop-shadow(0 0 10px rgba(168,85,247,0.9)); }
        }
        .node.search-target .node-card {
            animation: nodeTargetPulse 1s infinite alternate !important;
        }
        .tree-group.searching .node:not(.search-match) {
            opacity: 0.25;
            transition: opacity 0.3s ease;
        }
        .tree-group.searching .node.search-match {
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .tree-group.searching .node.search-match .node-card {
            stroke: #a855f7 !important;
            stroke-width: 2.5px !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <h1>Markov Family Tree</h1>
            <p>Interactive Top-to-Bottom Genealogical Diagram</p>
        </div>

        <div class="header-right">
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot couple"></div> Couple
                </div>
                <div class="legend-item">
                    <div class="legend-dot single"></div> Individual
                </div>
                <div class="legend-item">
                    <div class="legend-dot collapsed"></div> Collapsed
                </div>
            </div>

            <div class="stats-bar">
                <span class="stat-badge" id="stat-members">Loading...</span>
                <span class="stat-badge" id="stat-generations">Loading...</span>
            </div>

            <div class="controls-bar">
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-input" class="search-input" placeholder="Search member, city, dates..." autocomplete="off">
                        <button id="search-clear" class="search-clear-btn" style="display:none;" onclick="clearSearch()" title="Clear search">×</button>
                    </div>
                    <div id="search-results" class="search-results-dropdown" style="display:none;"></div>
                </div>

                <button class="btn btn-primary" onclick="fitToScreen()" title="Fit entire tree to screen">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    Fit Screen
                </button>
                <button class="btn" onclick="zoomIn()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    Zoom +
                </button>
                <button class="btn" onclick="zoomOut()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    Zoom -
                </button>
                <button class="btn" onclick="expandAll()">Expand All</button>
                <button class="btn" onclick="collapseAll()">Collapse</button>
                <button class="btn" onclick="exportToSVG()" title="Export full tree as vector SVG file">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Export SVG
                </button>
            </div>
        </div>
    </div>

    <div class="tree-viewport">
        <svg id="tree-container"></svg>
        <div class="hint-toast">💡 Drag to Pan · Scroll to Zoom · Click node to Expand/Collapse</div>
    </div>

    <script>
        // ─── Layout constants ──────────────────────────────────────────────────────
        // NODE_W / NODE_H: reserved "slot" per node for separation.
        // The actual card is smaller; this gives breathing room between siblings.
        const NODE_W = 200;   // horizontal slot width per leaf — controls horizontal spread
        const GEN_H  = 220;   // vertical distance between generation rows

        const CARD_W = 180;   // visible card width
        const CARD_PAD_Y = 8; // vertical padding inside card

        const LINE_H = 13;    // px per text line inside the card
        const ICON_R = 7;     // radius of the inner circle icon

        const margin = { top: 60, right: 60, bottom: 80, left: 60 };

        let svg, g, zoom, root, treeLayout;
        let realDescendants = [];
        let activeSearchQuery = "";

        // ─── Helper: is this node a couple? ───────────────────────────────────────
        function isCouple(d) {
            return (d.data.name || "").includes("&");
        }

        // ─── Helper: estimate total text lines for a node ─────────────────────────
        function nodeLines(d) {
            const name = d.data.name || "";
            const nameParts = name.includes("&")
                ? name.split("&").map((p, i) => (i === 1 ? "& " + p.trim() : p.trim()))
                : [name];
            let lines = nameParts.length;
            if (d.data.attributes?.Location) lines++;
            if (d.data.attributes?.Dates)    lines++;
            if (d.data.attributes?.Note)     lines++;
            return lines;
        }

        // ─── Helper: card height for a node ───────────────────────────────────────
        function cardHeight(d) {
            return CARD_PAD_Y * 2 + nodeLines(d) * LINE_H + ICON_R * 2 + 6;
        }

        // ─── Load data ─────────────────────────────────────────────────────────────
        d3.json("gentree-gridnev.json").then(function (treeData) {
            const hierarchyInput = Array.isArray(treeData)
                ? { name: "__root__", children: treeData }
                : treeData;

            root = d3.hierarchy(hierarchyInput);

            realDescendants = root.descendants().filter(d => d.data.name !== "__root__");
            document.getElementById("stat-members").textContent     = `${realDescendants.length} Members`;
            document.getElementById("stat-generations").textContent = `${root.height} Generations`;

            // Compute canvas dimensions.
            // Width: narrow — just wide enough for the viewport, let vertical scroll do the work.
            // Height: deep — one generation row = GEN_H px.
            const leafCount = root.leaves().length;
            const canvasW   = Math.max(leafCount * NODE_W, 1200);
            const canvasH   = Math.max((root.height + 1) * GEN_H + margin.top + margin.bottom, 800);

            svg = d3.select("#tree-container");
            svg.selectAll("*").remove();

            // Transparent background rect to capture drag events everywhere
            svg.append("rect").attr("width", "100%").attr("height", "100%").attr("fill", "transparent");

            g = svg.append("g").attr("class", "tree-group");

            zoom = d3.zoom()
                .scaleExtent([0.04, 4])
                .on("zoom", event => g.attr("transform", event.transform));

            svg.call(zoom).on("dblclick.zoom", null);

            treeLayout = d3.tree()
                .size([canvasW - margin.left - margin.right, canvasH - margin.top - margin.bottom])
                .separation((a, b) => {
                    // Give more horizontal separation for couples (wider names)
                    const aW = isCouple(a) ? 1.4 : 1;
                    const bW = isCouple(b) ? 1.4 : 1;
                    return (a.parent === b.parent ? 1 : 1.3) * Math.max(aW, bW);
                });

            update(root);
            initSearch();
            setTimeout(fitToScreen, 150);
            window.addEventListener("resize", fitToScreen);

        }).catch(err => console.error("Error loading JSON:", err));

        // ─── Render / Update ───────────────────────────────────────────────────────
        function update(source) {
            treeLayout(root);

            const isSyntheticRoot = d => d.data.name === "__root__";
            const nodes = root.descendants().filter(d => !isSyntheticRoot(d));
            const links = root.links().filter(l => !isSyntheticRoot(l.source));

            // ── Links ──────────────────────────────────────────────────────────────
            const linkSel = g.selectAll(".link")
                .data(links, d => d.target.data.name + (d.target.data.attributes?.Location || ""));

            linkSel.enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical()
                    .x(d => d.x + margin.left)
                    .y(d => d.y + margin.top))
                .merge(linkSel)
                .transition().duration(350)
                .attr("d", d3.linkVertical()
                    .x(d => d.x + margin.left)
                    .y(d => d.y + margin.top));

            linkSel.exit().remove();

            // ── Nodes ──────────────────────────────────────────────────────────────
            const nodeSel = g.selectAll(".node")
                .data(nodes, d => d.data.name + (d.data.attributes?.Location || ""));

            const nodeEnter = nodeSel.enter().append("g")
                .attr("class", d => {
                    const base = "node";
                    const hasKids = d.children || d._children;
                    const collapsed = !!d._children;
                    return [base, hasKids ? "has-children" : "", collapsed ? "collapsed" : ""].join(" ").trim();
                })
                .attr("transform", d => `translate(${d.x + margin.left},${d.y + margin.top})`)
                .on("click", (event, d) => {
                    if (d.children)  { d._children = d.children; d.children = null; }
                    else if (d._children) { d.children = d._children; d._children = null; }
                    update(d);
                });

            // Build card content for each new node
            nodeEnter.each(function (d) {
                const el = d3.select(this);
                const couple = isCouple(d);
                const name   = d.data.name || "";
                const nameParts = couple
                    ? name.split("&").map((p, i) => i === 1 ? "& " + p.trim() : p.trim())
                    : [name];

                const ch = cardHeight(d);
                const iconTop = -ch / 2;  // top of the card relative to the node anchor

                // ── Background card ────────────────────────────────────────────────
                el.append("rect")
                    .attr("class", `node-card ${couple ? "couple-card" : ""}`)
                    .attr("x", -CARD_W / 2)
                    .attr("y", iconTop)
                    .attr("width", CARD_W)
                    .attr("height", ch)
                    .attr("rx", 7)
                    .attr("ry", 7)
                    .attr("stroke", couple ? "#3b82f6" : "#22c55e")
                    .attr("stroke-width", 1);

                // ── Node icon (couple = double-ring; single = filled circle) ───────
                const iconCY = iconTop + ICON_R + 5;

                if (couple) {
                    // Outer ring
                    el.append("circle")
                        .attr("class", "node-icon-outer")
                        .attr("cx", 0).attr("cy", iconCY)
                        .attr("r", ICON_R + 3);
                    // Inner filled circle
                    el.append("circle")
                        .attr("class", "node-icon-inner")
                        .attr("cx", 0).attr("cy", iconCY)
                        .attr("r", ICON_R);
                } else {
                    el.append("circle")
                        .attr("class", "node-icon-single")
                        .attr("cx", 0).attr("cy", iconCY)
                        .attr("r", ICON_R);
                }

                // ── Text content ───────────────────────────────────────────────────
                let textY = iconCY + ICON_R + 5;

                // Name lines
                const textEl = el.append("text")
                    .attr("class", `name-text ${couple ? "couple-name" : ""}`)
                    .attr("x", 0)
                    .attr("y", textY);

                nameParts.forEach((part, i) => {
                    textEl.append("tspan")
                        .attr("x", 0)
                        .attr("dy", i === 0 ? "0" : `${LINE_H}px`)
                        .text(part);
                });
                textY += (nameParts.length - 1) * LINE_H + LINE_H;

                // Location
                if (d.data.attributes?.Location) {
                    el.append("text")
                        .attr("class", "meta-text")
                        .attr("x", 0).attr("y", textY)
                        .attr("fill", "#38bdf8")
                        .text(`📍 ${d.data.attributes.Location}`);
                    textY += LINE_H;
                }
                // Dates
                if (d.data.attributes?.Dates) {
                    el.append("text")
                        .attr("class", "meta-text")
                        .attr("x", 0).attr("y", textY)
                        .attr("fill", "#94a3b8")
                        .text(`🗓 ${d.data.attributes.Dates}`);
                    textY += LINE_H;
                }
                // Note
                if (d.data.attributes?.Note) {
                    el.append("text")
                        .attr("class", "meta-text")
                        .attr("x", 0).attr("y", textY)
                        .attr("fill", "#f59e0b")
                        .text(`ℹ️ ${d.data.attributes.Note}`);
                }
            });

            // Update existing nodes' class and position
            nodeSel.merge(nodeEnter)
                .attr("class", d => {
                    const hasKids = d.children || d._children;
                    return ["node", hasKids ? "has-children" : "", d._children ? "collapsed" : ""].join(" ").trim();
                })
                .transition().duration(350)
                .attr("transform", d => `translate(${d.x + margin.left},${d.y + margin.top})`);

            nodeSel.exit().remove();

            // ── Hover: highlight ancestry path ─────────────────────────────────────
            g.selectAll(".node")
                .on("mouseenter", (event, d) => {
                    const anc = new Set(d.ancestors());
                    g.selectAll(".link").classed("highlighted", l => anc.has(l.target) && anc.has(l.source));
                })
                .on("mouseleave", () => g.selectAll(".link").classed("highlighted", false));
        }

        // ─── Fit to viewport ───────────────────────────────────────────────────────
        function fitToScreen() {
            if (!g || !svg) return;
            const bounds = g.node().getBBox();
            if (!bounds.width || !bounds.height) return;
            const parent = svg.node().parentElement;
            const fw = parent.clientWidth;
            const fh = parent.clientHeight;
            const pad = 30;
            const scale = Math.min((fw - pad * 2) / bounds.width, (fh - pad * 2) / bounds.height, 1.2);
            const tx = fw / 2 - scale * (bounds.x + bounds.width / 2);
            const ty = fh / 2 - scale * (bounds.y + bounds.height / 2);
            svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
        }

        function zoomIn()  { svg.transition().duration(300).call(zoom.scaleBy, 1.3); }
        function zoomOut() { svg.transition().duration(300).call(zoom.scaleBy, 0.7); }

        function expandAll() {
            function expand(d) {
                if (d._children) { d.children = d._children; d._children = null; }
                if (d.children) d.children.forEach(expand);
            }
            expand(root);
            update(root);
            setTimeout(fitToScreen, 450);
        }

        function collapseAll() {
            function collapse(n) {
                if (n.children) { n._children = n.children; n.children = null; }
                if (n._children) n._children.forEach(collapse);
            }
            if (root.children) root.children.forEach(collapse);
            update(root);
            setTimeout(fitToScreen, 450);
        }

        // ─── Search & Filter Implementation ─────────────────────────────────────────
        function initSearch() {
            const input = document.getElementById("search-input");
            const clearBtn = document.getElementById("search-clear");
            const resultsContainer = document.getElementById("search-results");

            if (!input) return;

            input.addEventListener("input", (e) => {
                const query = e.target.value;
                activeSearchQuery = query.trim().toLowerCase();
                clearBtn.style.display = query ? "block" : "none";
                performSearch(activeSearchQuery);
            });

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".search-container")) {
                    resultsContainer.style.display = "none";
                }
            });

            input.addEventListener("focus", () => {
                if (activeSearchQuery) {
                    performSearch(activeSearchQuery);
                }
            });
        }

        function clearSearch() {
            const input = document.getElementById("search-input");
            const clearBtn = document.getElementById("search-clear");
            const resultsContainer = document.getElementById("search-results");

            if (input) input.value = "";
            activeSearchQuery = "";
            if (clearBtn) clearBtn.style.display = "none";
            if (resultsContainer) resultsContainer.style.display = "none";

            if (g) {
                g.classed("searching", false);
                g.selectAll(".node").classed("search-match", false).classed("search-target", false);
            }
        }

        function performSearch(query) {
            const resultsContainer = document.getElementById("search-results");
            if (!resultsContainer) return;

            if (!query) {
                clearSearch();
                return;
            }

            const matches = realDescendants.filter(d => {
                const name  = (d.data.name || "").toLowerCase();
                const loc   = (d.data.attributes?.Location || "").toLowerCase();
                const dates = (d.data.attributes?.Dates || "").toLowerCase();
                const note  = (d.data.attributes?.Note || "").toLowerCase();
                return name.includes(query) || loc.includes(query) || dates.includes(query) || note.includes(query);
            });

            // Update canvas node classes
            if (g) {
                g.classed("searching", true);
                g.selectAll(".node").each(function(d) {
                    const isMatch = matches.includes(d);
                    d3.select(this).classed("search-match", isMatch);
                });
            }

            // Render Dropdown List
            resultsContainer.style.display = "block";
            resultsContainer.innerHTML = "";

            if (matches.length === 0) {
                resultsContainer.innerHTML = `<div class="search-no-results">No family members found for "${escapeHtml(query)}"</div>`;
                return;
            }

            const header = document.createElement("div");
            header.className = "search-summary-header";
            header.textContent = `Found ${matches.length} matching member${matches.length > 1 ? 's' : ''}`;
            resultsContainer.appendChild(header);

            matches.slice(0, 30).forEach(d => {
                const item = document.createElement("div");
                item.className = "search-result-item";

                let metaHtml = "";
                if (d.data.attributes?.Location) {
                    metaHtml += `<span>📍 ${escapeHtml(d.data.attributes.Location)}</span>`;
                }
                if (d.data.attributes?.Dates) {
                    metaHtml += `<span>🗓 ${escapeHtml(d.data.attributes.Dates)}</span>`;
                }

                item.innerHTML = `
                    <div class="search-result-name">${highlightText(d.data.name, query)}</div>
                    ${metaHtml ? `<div class="search-result-meta">${metaHtml}</div>` : ''}
                `;

                item.addEventListener("click", () => {
                    selectSearchResult(d);
                    resultsContainer.style.display = "none";
                });

                resultsContainer.appendChild(item);
            });
        }

        function selectSearchResult(d) {
            // 1. Expand all parent ancestors so target node is visible
            let ancestor = d.parent;
            let needsUpdate = false;
            while (ancestor) {
                if (ancestor._children) {
                    ancestor.children = ancestor._children;
                    ancestor._children = null;
                    needsUpdate = true;
                }
                ancestor = ancestor.parent;
            }

            if (needsUpdate) {
                update(root);
            }

            // 2. Smoothly center & zoom to target node
            const parent = svg.node().parentElement;
            const fw = parent.clientWidth;
            const fh = parent.clientHeight;
            const scale = 1.3;
            const tx = fw / 2 - scale * (d.x + margin.left);
            const ty = fh / 2 - scale * (d.y + margin.top);

            svg.transition().duration(750).call(
                zoom.transform,
                d3.zoomIdentity.translate(tx, ty).scale(scale)
            );

            // 3. Highlight / Flash target node
            g.selectAll(".node").classed("search-target", false);
            g.selectAll(".node")
                .filter(n => n === d)
                .classed("search-target", true);

            setTimeout(() => {
                g.selectAll(".node").classed("search-target", false);
            }, 4000);
        }

        function highlightText(text, query) {
            if (!query) return escapeHtml(text);
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return escapeHtml(text);
            const before = text.substring(0, idx);
            const match = text.substring(idx, idx + query.length);
            const after = text.substring(idx + query.length);
            return `${escapeHtml(before)}<strong style="color: #38bdf8; text-decoration: underline;">${escapeHtml(match)}</strong>${escapeHtml(after)}`;
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // ─── Export SVG Implementation ──────────────────────────────────────────────
        function exportToSVG() {
            if (!svg || !g) {
                alert("Tree canvas is not ready yet.");
                return;
            }

            // 1. Calculate actual bounding box of the rendered tree content
            const bbox = g.node().getBBox();
            if (!bbox || !bbox.width || !bbox.height) {
                alert("No visible tree elements to export.");
                return;
            }

            const padding = 45;
            const x = Math.floor(bbox.x - padding);
            const y = Math.floor(bbox.y - padding);
            const width = Math.ceil(bbox.width + padding * 2);
            const height = Math.ceil(bbox.height + padding * 2);

            // 2. Clone the tree SVG group
            const clonedG = g.node().cloneNode(true);

            // Clean up interactive search classes from cloned node elements
            clonedG.classList.remove("searching");
            const clonedNodes = clonedG.querySelectorAll(".node");
            clonedNodes.forEach(node => {
                node.classList.remove("search-match", "search-target");
                node.style.opacity = "";
            });
            const clonedLinks = clonedG.querySelectorAll(".link");
            clonedLinks.forEach(link => link.classList.remove("highlighted"));

            // Reset group transform so positioning aligns strictly with SVG viewBox
            clonedG.setAttribute("transform", "");

            // 3. Embedded standalone CSS styles
            const embeddedStyles = `
                @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
                text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
                .node-card { fill: rgba(15, 23, 42, 0.95); rx: 7px; ry: 7px; }
                .node-card.couple-card { fill: rgba(30, 58, 95, 0.95); }
                .node-icon-outer { fill: none; stroke-width: 2px; stroke: #3b82f6; }
                .node-icon-inner { fill: #3b82f6; stroke: #93c5fd; stroke-width: 1.5px; }
                .node-icon-single { fill: #22c55e; stroke: #4ade80; stroke-width: 2px; }
                .node.collapsed .node-icon-outer,
                .node.collapsed .node-icon-inner,
                .node.collapsed .node-icon-single { fill: #f59e0b; stroke: #fde047; }
                .node text.name-text { font-size: 11px; font-weight: 500; fill: #f1f5f9; text-anchor: middle; }
                .node text.name-text.couple-name { fill: #93c5fd; }
                .node text.meta-text { font-size: 9.5px; font-weight: 400; text-anchor: middle; }
                .link { fill: none; stroke: #334155; stroke-width: 1.5px; stroke-linecap: round; }
            `;

            // 4. Serialize content XML
            const serializer = new XMLSerializer();
            const contentXml = serializer.serializeToString(clonedG);

            const fullSvgString = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink" 
     viewBox="${x} ${y} ${width} ${height}" 
     width="${width}" 
     height="${height}">
    <style>
        ${embeddedStyles}
    </style>
    <!-- Background backdrop -->
    <rect x="${x}" y="${y}" width="${width}" height="${height}" fill="#0f172a" />
    ${contentXml}
</svg>`;

            // 5. Trigger download file
            const blob = new Blob([fullSvgString], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = `gentree-family-tree-${new Date().toISOString().slice(0,10)}.svg`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url);
        }
    </script>
